name = "askcaptainjim-weather"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The Open-Meteo commercial key is a secret, not a var — set it once with:
#   npx wrangler secret put OPEN_METEO_KEY

# Google Places key for /places/* (marina lookup):
#   npx wrangler secret put GOOGLE_PLACES_KEY

# Captain's Brief feed: the Apps Script web app URL (daily-brief/brief-Code.gs). Not a secret —
# the script only ever returns approved rows. Deployed by Russ 2026-10-13 (Apps Script project "Captains Brief").
[vars]
BRIEF_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4vsL-cECU25Emt1iBXV0wUNSAxpjWy7IwNNlIn4JRbwcHIhTqRP7lipK19jvaQyk-/exec"
