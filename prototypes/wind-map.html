<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SailWindow Wind Map — prototype</title>
<!-- PROTOTYPE. Weather comes through the askcaptainjim-weather Worker (weather-worker/),
     which holds the commercial Open-Meteo key and caches responses for 30 min. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{ --primary:#0e7c86; --ink:#0f2233; --glass:rgba(15,34,51,.82); }
  html,body{ margin:0; height:100%; background:#0f2233; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #map{ position:absolute; inset:0; }
  .leaflet-pane.leaflet-wind-pane{ pointer-events:none; }
  .bar{ position:absolute; left:50%; transform:translateX(-50%); z-index:1000; display:flex; gap:6px; align-items:center;
        background:var(--glass); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
        border-radius:999px; padding:6px; color:#fff; box-shadow:0 6px 24px rgba(0,0,0,.25); max-width:calc(100vw - 32px); }
  .top{ top:14px; overflow-x:auto; }
  .bottom{ bottom:18px; }
  .bar button, .bar select{ font:inherit; font-size:14px; color:#fff; background:transparent; border:0; border-radius:999px;
        padding:8px 14px; cursor:pointer; white-space:nowrap; }
  .bar button:hover{ background:rgba(255,255,255,.12); }
  .bar button.on{ background:#fff; color:var(--ink); font-weight:600; }
  .bar select{ background:rgba(255,255,255,.1); appearance:none; padding-right:14px; }
  .bar select option{ color:#000; }
  #time-label{ min-width:118px; text-align:center; font-weight:600; font-size:15px; }
  .round{ width:36px; height:36px; padding:0 !important; display:grid; place-items:center; background:rgba(255,255,255,.12) !important; }
  #scrub{ width:180px; accent-color:#f26a3d; }
  .badge{ position:absolute; top:70px; right:14px; z-index:1000; background:var(--glass); color:#dfe9f1; font-size:12px;
          padding:6px 12px; border-radius:999px; }
  .legend{ position:absolute; left:14px; bottom:84px; z-index:1000; background:var(--glass); color:#fff; border-radius:12px;
           padding:10px 12px; font-size:12px; line-height:1.5; }
  .legend i{ display:inline-block; width:14px; height:10px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .status{ position:absolute; top:70px; left:14px; z-index:1000; background:var(--glass); color:#fff; font-size:12px;
           padding:6px 12px; border-radius:999px; display:none; }
  /* Tap readout, modeled on the screenshot's pill pair */
  .pill-wrap{ display:flex; gap:6px; transform:translate(-50%, calc(-100% - 18px)); }
  .pill{ background:#0f2233; color:#fff; border-radius:16px; padding:8px 14px; display:flex; align-items:center; gap:10px;
         box-shadow:0 4px 16px rgba(0,0,0,.35); white-space:nowrap; border:1.5px solid rgba(255,255,255,.85); }
  .pill .big{ font-size:26px; font-weight:800; line-height:1; }
  .pill .sub{ font-size:12px; line-height:1.25; opacity:.9; }
  .pill .arrow{ display:inline-block; font-size:18px; }
  .pin{ width:12px; height:12px; border-radius:50%; background:#fff; border:3px solid #0f2233; transform:translate(-50%,-50%); }
  @media (max-width:600px){ #scrub{ width:90px; } .legend{ bottom:150px; } .bottom{ flex-wrap:wrap; justify-content:center; border-radius:20px; } }
</style>
</head>
<body>
<div id="map"></div>

<div class="bar top">
  <button class="on" data-layer="wind"><i class="fa-solid fa-wind"></i> Wind</button>
  <button data-layer="gust"><i class="fa-solid fa-bolt"></i> Gusts</button>
  <button data-layer="waves"><i class="fa-solid fa-water"></i> Waves</button>
  <select id="region" aria-label="Jump to area">
    <option value="29.25,-94.8,9">Galveston Bay</option>
    <option value="30.4,-88.0,9">Mobile Bay</option>
    <option value="30.35,-87.2,10" selected>Pensacola</option>
    <option value="27.7,-82.65,9">Tampa Bay</option>
    <option value="26.45,-82.1,9">Charlotte Harbor</option>
    <option value="24.65,-81.3,9">Florida Keys</option>
    <option value="27.5,-87.5,6">Whole Gulf</option>
  </select>
</div>
<div class="badge">Wind wash · Open-Meteo model</div>
<div class="status" id="status">Loading forecast…</div>
<div class="legend" id="legend"></div>

<div class="bar bottom">
  <button class="round" id="prev" aria-label="Previous hour"><i class="fa-solid fa-chevron-left"></i></button>
  <div id="time-label">Now</div>
  <button class="round" id="next" aria-label="Next hour"><i class="fa-solid fa-chevron-right"></i></button>
  <input type="range" id="scrub" min="0" max="71" value="0" aria-label="Forecast hour">
  <button class="round" id="play" aria-label="Play"><i class="fa-solid fa-play"></i></button>
</div>

<script>
// ---- Color bands, tied to scorePeriod() in shared/engine.js (wind <4 or >26 kt scores 0) ----
const WIND_BANDS = [
  [0,  [110, 90,170], 'Under 4 kt — too light'],
  [4,  [ 70,140,210], '4–8 kt — light air'],
  [8,  [ 40,175,120], '8–15 kt — sweet spot'],
  [15, [235,200, 60], '15–20 kt — fresh'],
  [20, [240,130, 50], '20–26 kt — strong'],
  [26, [215, 50, 60], 'Over 26 kt — no-go'],
];
const WAVE_BANDS = [
  [0,  [ 60,150,210], 'Under 1 ft'],
  [1,  [ 40,175,120], '1–2 ft'],
  [2,  [235,200, 60], '2–4 ft'],
  [4,  [240,130, 50], '4–6 ft'],
  [6,  [215, 50, 60], 'Over 6 ft'],
];
function colorFor(v, bands){
  // smooth blend between band anchors so the wash has no hard edges
  for(let i=bands.length-1;i>=0;i--){
    if(v >= bands[i][0]){
      const a = bands[i], b = bands[i+1];
      if(!b) return a[1];
      const t = Math.min(1, (v - a[0]) / (b[0] - a[0]));
      return a[1].map((c,k)=> c + (b[1][k]-c)*t*t);   // ease toward the next band
    }
  }
  return bands[0][1];
}

// ---- Map: label tiles sit above the wash, like the screenshot ----
const map = L.map('map', { zoomControl:false, maxZoom:13 }).setView([30.35,-87.2], 10);
L.control.zoom({ position:'topright' }).addTo(map);
// CARTO now needs an API key (since Sept 2026), so the prototype uses Esri's ocean basemap.
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}',
  { maxZoom:13, attribution:'Basemap &copy; Esri, GEBCO, NOAA · Weather: Open-Meteo.com (CC BY 4.0)' }).addTo(map);
map.createPane('wind');  map.getPane('wind').style.zIndex = 450; map.getPane('wind').classList.add('leaflet-wind-pane');
map.createPane('labels'); map.getPane('labels').style.zIndex = 500; map.getPane('labels').style.pointerEvents = 'none';
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}',
  { maxZoom:13, pane:'labels' }).addTo(map);

// ---- Forecast grid: snapped to a fixed lattice so panning reuses cached points ----
// Commercial Open-Meteo via our Worker: keeps the API key server-side and shares a cache.
const WEATHER_PROXY = 'https://askcaptainjim-weather.russjamieson.workers.dev';
const HOURS = 72;
const cache = new Map();        // "lat,lon" -> { s:[], g:[], d:[] }   (knots, degrees-from)
const waveCache = new Map();    // "lat,lon" -> { h:[] } feet, or null for land points
let hour0 = null;               // unix seconds of index 0
let grid = null;                // { lats:[], lons:[], step }
let hourIdx = 0, layer = 'wind';
const key = (a,b)=> a.toFixed(3)+','+b.toFixed(3);

function stepForZoom(z){ return z >= 10 ? 0.1 : z >= 9 ? 0.15 : z >= 8 ? 0.25 : z >= 7 ? 0.5 : 1; }

function buildGrid(){
  const b = map.getBounds().pad(0.15);
  let step = stepForZoom(map.getZoom());
  let lats, lons;
  for(;;){
    lats=[]; lons=[];
    for(let la=Math.floor(b.getSouth()/step)*step; la<=b.getNorth()+step; la+=step) lats.push(+la.toFixed(3));
    for(let lo=Math.floor(b.getWest()/step)*step;  lo<=b.getEast()+step;  lo+=step) lons.push(+lo.toFixed(3));
    if(lats.length*lons.length <= 260) break;    // keep each map load to a few hundred API "calls"
    step *= 1.5;
  }
  return { lats, lons, step };
}

async function fetchBatch(points, marine){
  const lat = points.map(p=>p[0]).join(','), lon = points.map(p=>p[1]).join(',');
  const url = marine
    ? `${WEATHER_PROXY}/marine?latitude=${lat}&longitude=${lon}&hourly=wave_height&length_unit=imperial&timeformat=unixtime&forecast_hours=${HOURS}`
    : `${WEATHER_PROXY}/forecast?latitude=${lat}&longitude=${lon}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=kn&timeformat=unixtime&forecast_hours=${HOURS}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error((marine?'Marine':'Forecast')+' API '+res.status);
  const j = await res.json();
  return Array.isArray(j) ? j : [j];
}

async function ensureData(){
  const need = [], needWave = [];
  for(const la of grid.lats) for(const lo of grid.lons){
    if(!cache.has(key(la,lo))) need.push([la,lo]);
    if(layer==='waves' && !waveCache.has(key(la,lo))) needWave.push([la,lo]);
  }
  if(!need.length && !needWave.length) return;
  showStatus(`Loading forecast for ${need.length + needWave.length} points…`);
  const chunks = (arr)=>{ const out=[]; for(let i=0;i<arr.length;i+=100) out.push(arr.slice(i,i+100)); return out; };
  try{
    await Promise.all([
      ...chunks(need).map(async pts=>{
        const rows = await fetchBatch(pts,false);
        rows.forEach((r,i)=>{
          if(hour0===null) hour0 = r.hourly.time[0];
          cache.set(key(...pts[i]), { s:r.hourly.wind_speed_10m, g:r.hourly.wind_gusts_10m, d:r.hourly.wind_direction_10m,
                                         land: r.elevation > 1 });   // Open-Meteo reports 0 m elevation over water
        });
      }),
      ...chunks(needWave).map(async pts=>{
        const rows = await fetchBatch(pts,true);
        rows.forEach((r,i)=> waveCache.set(key(...pts[i]), r.hourly && r.hourly.wave_height.some(v=>v!=null) ? { h:r.hourly.wave_height } : null));
      }),
    ]);
    hideStatus();
  }catch(e){ showStatus('Forecast unavailable: '+e.message); console.error(e); }
}

// Bilinear sample of the lattice at an arbitrary lat/lon, for the current hour.
// Returns { s, g, u, v, w } — u/v are the direction the wind blows TOWARD (east, north).
function sample(lat, lon){
  const { lats, lons, step } = grid;
  const fy = (lat - lats[0]) / step, fx = (lon - lons[0]) / step;
  const y0 = Math.max(0, Math.min(lats.length-2, Math.floor(fy))), x0 = Math.max(0, Math.min(lons.length-2, Math.floor(fx)));
  const ty = Math.max(0, Math.min(1, fy - y0)), tx = Math.max(0, Math.min(1, fx - x0));
  let s=0,g=0,u=0,v=0,w=0,wWeight=0,total=0,land=0;
  for(const [dy,dx,wt] of [[0,0,(1-ty)*(1-tx)],[0,1,(1-ty)*tx],[1,0,ty*(1-tx)],[1,1,ty*tx]]){
    const la = lats[y0+dy], lo = lons[x0+dx], c = cache.get(key(la,lo));
    if(!c || c.s[hourIdx]==null) continue;
    const sp = c.s[hourIdx], dir = c.d[hourIdx] * Math.PI/180;
    s += sp*wt; g += (c.g[hourIdx]??sp)*wt; total += wt; if(c.land) land += wt;
    u += -sp*Math.sin(dir)*wt; v += -sp*Math.cos(dir)*wt;
    const wc = waveCache.get(key(la,lo));
    // the marine model is coarse and smears offshore seas inland, so only water cells count
    if(!c.land && wc && wc.h[hourIdx]!=null){ w += wc.h[hourIdx]*wt; wWeight += wt; }
  }
  if(!total) return null;
  const onLand = land/total > 0.5;
  return { s:s/total, g:g/total, u:u/total, v:v/total, w: wWeight && !onLand ? w/wWeight : null, onLand };
}

// ---- Canvas layer: wash + animated streaks, repositioned to the viewport on every move ----
const pane = map.getPane('wind');
const washCv = L.DomUtil.create('canvas','',pane), flowCv = L.DomUtil.create('canvas','',pane);
const wctx = washCv.getContext('2d'), fctx = flowCv.getContext('2d');
const CELL = 8;
let field = null;   // screen-space velocity field: { cols, rows, u:Float32Array, v:Float32Array }
let particles = [];

function sizeCanvases(){
  const sz = map.getSize(), dpr = window.devicePixelRatio || 1;
  for(const cv of [washCv, flowCv]){
    cv.width = sz.x*dpr; cv.height = sz.y*dpr; cv.style.width = sz.x+'px'; cv.style.height = sz.y+'px';
    cv.style.position='absolute';
    cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  }
  washCv.style.opacity = .62;
}

function redraw(){
  if(!grid) return;
  const topLeft = map.containerPointToLayerPoint([0,0]);
  L.DomUtil.setPosition(washCv, topLeft); L.DomUtil.setPosition(flowCv, topLeft);
  const sz = map.getSize(), cols = Math.ceil(sz.x/CELL)+1, rows = Math.ceil(sz.y/CELL)+1;
  // Paint one pixel per cell into a tiny canvas, then let the browser smooth-scale it up.
  const small = document.createElement('canvas'); small.width = cols; small.height = rows;
  const sctx = small.getContext('2d'), img = sctx.createImageData(cols, rows);
  const u = new Float32Array(cols*rows), v = new Float32Array(cols*rows);
  // knots -> pixels/frame; scaled so streaks read well at any zoom
  const speedScale = 0.06;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const ll = map.containerPointToLatLng([c*CELL, r*CELL]);
    const sm = sample(ll.lat, ll.lng), i = r*cols+c;
    if(!sm){ img.data[i*4+3]=0; continue; }
    const val = layer==='gust' ? sm.g : layer==='waves' ? sm.w : sm.s;
    if(val==null){ img.data[i*4+3]=0; }
    else{
      const col = colorFor(val, layer==='waves' ? WAVE_BANDS : WIND_BANDS);
      img.data[i*4]=col[0]; img.data[i*4+1]=col[1]; img.data[i*4+2]=col[2]; img.data[i*4+3]=255;
    }
    u[i] = sm.u*speedScale; v[i] = -sm.v*speedScale;   // screen y points down
  }
  sctx.putImageData(img,0,0);
  wctx.clearRect(0,0,sz.x,sz.y);
  wctx.imageSmoothingEnabled = true; wctx.imageSmoothingQuality = 'high';
  wctx.drawImage(small, 0, 0, cols*CELL, rows*CELL);
  field = { cols, rows, u, v };
  fctx.clearRect(0,0,sz.x,sz.y);
  seedParticles();
  updateReadout();
}

function seedParticles(){
  const sz = map.getSize(), n = Math.round(sz.x*sz.y/900);
  particles = Array.from({length:n}, ()=> newParticle(sz));
}
function newParticle(sz){ return { x:Math.random()*sz.x, y:Math.random()*sz.y, age:Math.floor(Math.random()*80) }; }

function fieldAt(x,y){
  const c = x/CELL, r = y/CELL, c0 = Math.floor(c), r0 = Math.floor(r);
  if(c0<0||r0<0||c0>=field.cols-1||r0>=field.rows-1) return null;
  const tx=c-c0, ty=r-r0, i=r0*field.cols+c0, j=i+field.cols;
  const lerp=(a)=> (a[i]*(1-tx)+a[i+1]*tx)*(1-ty) + (a[j]*(1-tx)+a[j+1]*tx)*ty;
  return [lerp(field.u), lerp(field.v)];
}

let animating = true;
function frame(){
  if(field && animating){
    const sz = map.getSize();
    // fade existing trails rather than clearing, which produces the streak effect
    fctx.globalCompositeOperation = 'destination-in';
    fctx.fillStyle = 'rgba(0,0,0,0.94)'; fctx.fillRect(0,0,sz.x,sz.y);
    fctx.globalCompositeOperation = 'source-over';
    fctx.strokeStyle = 'rgba(255,255,255,0.85)'; fctx.lineWidth = 1.5; fctx.beginPath();
    for(const p of particles){
      const vel = fieldAt(p.x,p.y);
      if(!vel || ++p.age > 90){ Object.assign(p, newParticle(sz), {age:0}); continue; }
      const nx = p.x + vel[0], ny = p.y + vel[1];
      fctx.moveTo(p.x,p.y); fctx.lineTo(nx,ny); p.x=nx; p.y=ny;
    }
    fctx.stroke();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- Tap readout ----
let pinMarker = null, pillMarker = null;
const CARD = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
map.on('click', async e=>{
  const { lat, lng } = e.latlng;
  if(pinMarker){ pinMarker.remove(); pillMarker.remove(); }
  pinMarker = L.marker(e.latlng, { icon:L.divIcon({ className:'', html:'<div class="pin"></div>', iconSize:[0,0] }) }).addTo(map);
  pillMarker = L.marker(e.latlng, { icon:L.divIcon({ className:'', html:'<div class="pill-wrap" id="readout"></div>', iconSize:[0,0] }), interactive:false }).addTo(map);
  // fetch waves for exactly this spot so the readout has sea state even on the Wind layer
  const k = key(lat,lng);
  if(!waveCache.has(k)){
    try{ const [r] = await fetchBatch([[lat,lng]], true);
         waveCache.set(k, r.hourly && r.hourly.wave_height.some(v=>v!=null) ? { h:r.hourly.wave_height } : null); }
    catch(_){ waveCache.set(k,null); }
  }
  pinMarker._waveKey = k;
  updateReadout();
});

function updateReadout(){
  const el = document.getElementById('readout');
  if(!el || !pinMarker) return;
  const ll = pinMarker.getLatLng(), sm = sample(ll.lat, ll.lng);
  if(!sm){ el.innerHTML = '<div class="pill"><span class="sub">No forecast here</span></div>'; return; }
  const fromDeg = (Math.atan2(-sm.u, -sm.v)*180/Math.PI + 360) % 360;
  const wc = waveCache.get(pinMarker._waveKey), wave = sm.onLand ? null : wc && wc.h[hourIdx];
  el.innerHTML =
    `<div class="pill"><span class="arrow" style="transform:rotate(${fromDeg+180}deg)">&#x25B2;</span>
       <span class="big">${Math.round(sm.s)}</span>
       <span class="sub">kn ${CARD[Math.round(fromDeg/22.5)%16]}<br>g${Math.round(sm.g)}</span></div>` +
    (wave!=null ? `<div class="pill"><i class="fa-solid fa-water"></i><span class="big" style="font-size:20px">${wave.toFixed(1)} ft</span></div>` : '');
}

// ---- Controls ----
function fmtHour(){
  if(hour0===null) return 'Now';
  const d = new Date((hour0 + hourIdx*3600)*1000), now = new Date();
  if(hourIdx===0 || Math.abs(d - now) < 1800e3) return 'Now';
  const day = d.toDateString()===now.toDateString() ? '' : d.toLocaleDateString([], { weekday:'short' })+' ';
  return day + d.toLocaleTimeString([], { hour:'numeric' });
}
function setHour(i){
  hourIdx = (i + HOURS) % HOURS;
  document.getElementById('scrub').value = hourIdx;
  document.getElementById('time-label').textContent = fmtHour();
  redraw();
}
document.getElementById('prev').onclick = ()=> setHour(hourIdx-1);
document.getElementById('next').onclick = ()=> setHour(hourIdx+1);
document.getElementById('scrub').oninput = e=> setHour(+e.target.value);
let playTimer = null;
document.getElementById('play').onclick = function(){
  if(playTimer){ clearInterval(playTimer); playTimer=null; this.innerHTML='<i class="fa-solid fa-play"></i>'; return; }
  this.innerHTML='<i class="fa-solid fa-pause"></i>';
  playTimer = setInterval(()=> setHour(hourIdx+1), 700);
};
document.querySelectorAll('[data-layer]').forEach(b=> b.onclick = async ()=>{
  document.querySelectorAll('[data-layer]').forEach(x=>x.classList.toggle('on', x===b));
  layer = b.dataset.layer; renderLegend(); await ensureData(); redraw();
});
document.getElementById('region').onchange = e=>{ const [a,b,z] = e.target.value.split(',').map(Number); map.setView([a,b], z); };

function renderLegend(){
  const bands = layer==='waves' ? WAVE_BANDS : WIND_BANDS;
  document.getElementById('legend').innerHTML =
    `<strong>${layer==='waves'?'Wave height':layer==='gust'?'Gusts':'Wind'}</strong><br>` +
    bands.map(b=>`<i style="background:rgb(${b[1].join(',')})"></i>${b[2]}`).join('<br>');
}
const showStatus = t=>{ const s=document.getElementById('status'); s.textContent=t; s.style.display='block'; };
const hideStatus = ()=> document.getElementById('status').style.display='none';

let moveTimer = null;
map.on('zoomstart', ()=>{ animating=false; washCv.style.display = flowCv.style.display = 'none'; });
map.on('movestart', ()=>{ animating=false; });
map.on('moveend', ()=>{
  clearTimeout(moveTimer);
  moveTimer = setTimeout(async ()=>{
    sizeCanvases(); grid = buildGrid();
    redraw(); await ensureData(); redraw();
    washCv.style.display = flowCv.style.display = ''; animating = true;
    document.getElementById('time-label').textContent = fmtHour();
  }, 250);
});
map.on('resize', ()=> map.fire('moveend'));

renderLegend();
map.fire('moveend');
</script>
</body>
</html>
